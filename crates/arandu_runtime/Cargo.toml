[package]
name = "arandu_runtime"
version = "0.1.11"
edition = "2024"
license.workspace = true
authors.workspace = true

[features]
fuzzing = []

[dependencies]
# SL_R.2 reactor (epoll + timerfd on Linux); portable fallback elsewhere
libc = "0.2.189"
arandu_testing_contract = { path = "../arandu_testing_contract" }
blake3.workspace = true

# SL_R.3 io_uring is Linux-only (MAP_POPULATE / SYS_io_uring_*). Do not pull
# this crate on macOS/Windows or install-smoke matrix builds fail to compile.
# Code paths are already #[cfg(target_os = "linux")]; keep the dep gated too.
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7.14"

[target.'cfg(windows)'.dependencies]
# RFC 0016 Windows capabilities: NtCreateFile/NtSetInformationFile (ntdll is
# already in the packaged runtime link set) plus kernel32 handle queries.
windows-sys = { version = "0.60.2", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]
