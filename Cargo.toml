[workspace]
exclude = ["arandu_fuzz"]
members = [
    "crates/arandu_base",
    "crates/arandu_lexer",
    "crates/arandu_diagnostics",
    "crates/arandu_parser",
    "crates/arandu_middle",
    "crates/arandu_resolve",
    "crates/arandu_typeck",
    "crates/arandu_mir",
    "crates/arandu_semantics",
    "crates/arandu_cli",
    "crates/arandu_backend_cranelift",
    "crates/arandu_test_support",
    "crates/arandu_fuzz_support",
    "crates/arandu_backend_c",
    "crates/arandu_backend_wasm",
    "crates/arandu_runtime",
    "crates/arandu_codegen",
    "crates/arandu_query",
    "crates/arandu_lsp",
    "crates/arandu_ide",
    "crates/arandu_fmt",
    "crates/arandu_doc",
    "xtask",
]
resolver = "3"

[workspace.package]
license = "MIT OR Apache-2.0"
authors = ["Arandu Language Contributors"]

[workspace.dependencies]
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
salsa = "0.28.2"                                                               # Salsa's new version (salsa-2022 tracked-based macro API)
blake3 = "1.8.5"
sha2 = "0.11.0"
smol_str = "0.3.6"
smallvec = "1.15.2"
rustc-hash = "2.1.3"
miette = { version = "7.6.0", features = ["fancy"] }
thiserror = "2.0.20"
petgraph = "0.8.3"
slotmap = "1.1.1"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
crossbeam-channel = "0.5.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.8.23"
semver = "1.0.28"
rowan = "0.17.0"
bumpalo = "3.20.3"
wasm-encoder = "0.252.0"
wasmparser = "0.252.0"
wit-component = "0.252.0"
wit-parser = "0.252.0"




[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2



[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
overflow-checks = false
debug = "line-tables-only"

[profile.release-with-debug]
inherits = "release"
debug = 2

[workspace.lints]
# Intentionally empty: use default toolchain lint levels.

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
