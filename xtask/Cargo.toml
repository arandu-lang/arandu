[package]
name = "xtask"
version = "0.1.7"
edition = "2021"
publish = false
license.workspace = true
authors.workspace = true
description = "Repo automation: diag docs, CI helpers (not shipped to users)"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
arandu_diagnostics = { path = "../crates/arandu_diagnostics" }
arandu_middle = { path = "../crates/arandu_middle" }
arandu_query = { path = "../crates/arandu_query" }
arandu_fuzz_support = { path = "../crates/arandu_fuzz_support" }
salsa = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
blake3 = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
zip = { workspace = true }
