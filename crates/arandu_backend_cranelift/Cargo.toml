[package]
name = "arandu_backend_cranelift"
version = "0.2.0"
edition = "2024"
license.workspace = true
authors.workspace = true

[dependencies]
arandu_base = { path = "../arandu_base" }
arandu_codegen = { path = "../arandu_codegen" }
arandu_runtime = { path = "../arandu_runtime" }
arandu_middle = { path = "../arandu_middle" }
arandu_mir = { path = "../arandu_mir" }
cranelift-codegen = "0.138.0"
cranelift-frontend = "0.138.0"
cranelift-jit = "0.138.0"
cranelift-module = "0.138.0"
cranelift-native = "0.138.0"
cranelift-object = "0.138.0"
gimli = { version = "0.34.0", default-features = false, features = ["std", "write"] }
target-lexicon = "0.13.6"
blake3 = { workspace = true }
rustc-hash = { workspace = true }
tracing.workspace = true

[dev-dependencies]
arandu_parser = { path = "../arandu_parser" }
arandu_semantics = { path = "../arandu_semantics" }
