name: SL_T Harness

on:
  # The native SDK/VSIX matrix is release-like evidence. Run it on PRs only
  # when its own product or distribution contract changes.
  pull_request:
    paths:
      - ".github/actions/setup-rust/action.yml"
      - ".github/workflows/sl-t-harness.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "crates/arandu_cli/**"
      - "crates/arandu_lsp/**"
      - "crates/arandu_runtime/**"
      - "editors/vscode/**"
      - "scripts/install-from-*"
      - "scripts/package-release.*"
      - "scripts/smoke_distribution.py"
      - "stdlib/**"
      - "tests/projects/slt6_*/**"
      - "tests/projects/medium/comptime_core/**"
      - "xtask/**"
  schedule:
    - cron: "41 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sl-t-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  vsix:
    name: SL_T / Package VSIX
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Validate and package the extension once
        working-directory: editors/vscode
        run: |
          npm ci --ignore-scripts
          npm run compile
          npm run lint
          npm run test:unit
          npm run package:vsix
      - name: Preserve candidate VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sl-t-candidate-vsix-${{ github.sha }}
          path: editors/vscode/.vscode-test/arandu-lang.vsix
          if-no-files-found: error
          retention-days: 14

  sdk:
    name: SL_T / SDK (${{ matrix.target }})
    # Starts concurrently with VSIX at t=0
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: sl-t6-${{ matrix.target }}-rust-1.97.1
      - name: Resolve package identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' crates/arandu_cli/Cargo.toml | head -1)"
          host="$(rustc -vV | sed -n 's/^host: //p')"
          test -n "$version"
          if [[ "$host" != "${{ matrix.target }}" ]]; then
            echo "error: native host $host does not match ${{ matrix.target }}" >&2
            exit 1
          fi
          {
            echo "VERSION=$version"
            echo "TARGET=${{ matrix.target }}"
          } >>"$GITHUB_ENV"

      - name: Build candidate SDK (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/package-release.sh
      - name: Build candidate SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-release.ps1

      - name: Install candidate outside checkout (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ARANDU_NO_MODIFY_PATH=1 PREFIX="$RUNNER_TEMP/arandu-sdk" \
            bash scripts/install-from-tarball.sh \
            "dist/arandu-${VERSION}-${TARGET}.tar.gz"
      - name: Install candidate outside checkout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/install-from-zip.ps1 `
            "dist/arandu-$env:VERSION-$env:TARGET.zip" `
            -Prefix "$env:RUNNER_TEMP/arandu-sdk" -NoModifyPath

      - name: Black-box package → test/bench (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo run --locked -p xtask -- check-slt6-sdk \
            --arandu "$RUNNER_TEMP/arandu-sdk/current/bin/arandu" \
            --work-dir "$RUNNER_TEMP/arandu-slt6-work" \
            --evidence-dir "$RUNNER_TEMP/arandu-slt6-evidence" \
            --expected-version "$VERSION"
      - name: Black-box package → test/bench (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo run --locked -p xtask -- check-slt6-sdk `
            --arandu "$env:RUNNER_TEMP/arandu-sdk/arandu-$env:VERSION/bin/arandu.exe" `
            --work-dir "$env:RUNNER_TEMP/arandu-slt6-work" `
            --evidence-dir "$env:RUNNER_TEMP/arandu-slt6-evidence" `
            --expected-version "$env:VERSION"

      - name: Upload candidate SDK package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sl-t-candidate-sdk-${{ matrix.target }}-${{ github.sha }}
          path: |
            dist/arandu-${{ env.VERSION }}-${{ matrix.target }}.${{ matrix.archive }}
            dist/arandu-${{ env.VERSION }}-${{ matrix.target }}.${{ matrix.archive }}.blake3
            dist/arandu-${{ env.VERSION }}-${{ matrix.target }}.${{ matrix.archive }}.blake3sum
            dist/arandu-${{ env.VERSION }}-${{ matrix.target }}.${{ matrix.archive }}.sha256
            dist/arandu-${{ env.VERSION }}-${{ matrix.target }}.${{ matrix.archive }}.sha256sum
          if-no-files-found: error
          retention-days: 7

      - name: Preserve native Gold evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sl-t-evidence-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/arandu-slt6-evidence/*
          if-no-files-found: warn
          retention-days: 30

  integration:
    name: SL_T / Integration (${{ matrix.target }})
    needs: [vsix, sdk]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve package identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' crates/arandu_cli/Cargo.toml | head -1)"
          {
            echo "VERSION=$version"
            echo "TARGET=${{ matrix.target }}"
          } >>"$GITHUB_ENV"
      - name: Download candidate SDK package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sl-t-candidate-sdk-${{ matrix.target }}-${{ github.sha }}
          path: dist
      - name: Install candidate outside checkout (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ARANDU_NO_MODIFY_PATH=1 PREFIX="$RUNNER_TEMP/arandu-sdk" \
            bash scripts/install-from-tarball.sh \
            "dist/arandu-${VERSION}-${TARGET}.tar.gz"
      - name: Install candidate outside checkout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/install-from-zip.ps1 `
            "dist/arandu-$env:VERSION-$env:TARGET.zip" `
            -Prefix "$env:RUNNER_TEMP/arandu-sdk" -NoModifyPath

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install Extension Host dependencies
        working-directory: editors/vscode
        run: npm ci --ignore-scripts
      - name: Compile the external Extension Host harness
        working-directory: editors/vscode
        run: npm run compile
      - name: Download the exact candidate VSIX
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sl-t-candidate-vsix-${{ github.sha }}
          path: editors/vscode/.vscode-test

      - name: Installed VSIX + installed SDK (Linux)
        if: runner.os == 'Linux'
        working-directory: editors/vscode
        shell: bash
        env:
          ARANDU_LSP_TEST_PATH: ${{ runner.temp }}/arandu-sdk/current/bin/arandu-lsp
          ARANDU_CLI_TEST_PATH: ${{ runner.temp }}/arandu-sdk/current/bin/arandu
        run: xvfb-run -a node ./out/test/runInstalledTest.js
      - name: Installed VSIX + installed SDK (macOS)
        if: runner.os == 'macOS'
        working-directory: editors/vscode
        env:
          ARANDU_LSP_TEST_PATH: ${{ runner.temp }}/arandu-sdk/current/bin/arandu-lsp
          ARANDU_CLI_TEST_PATH: ${{ runner.temp }}/arandu-sdk/current/bin/arandu
        run: node ./out/test/runInstalledTest.js
      - name: Installed VSIX + installed SDK (Windows)
        if: runner.os == 'Windows'
        working-directory: editors/vscode
        shell: pwsh
        env:
          ARANDU_LSP_TEST_PATH: ${{ runner.temp }}/arandu-sdk/arandu-${{ env.VERSION }}/bin/arandu-lsp.exe
          ARANDU_CLI_TEST_PATH: ${{ runner.temp }}/arandu-sdk/arandu-${{ env.VERSION }}/bin/arandu.exe
        run: node ./out/test/runInstalledTest.js

      - name: Preserve installed Extension Host failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-host-failure-${{ matrix.target }}-${{ github.sha }}
          path: editors/vscode/.vscode-test/failure-logs
          if-no-files-found: ignore
          retention-days: 14

  harness:
    name: SL_T / Harness
    if: always()
    needs: [vsix, sdk, integration]
    runs-on: ubuntu-24.04
    steps:
      - name: Require the complete native matrix
        env:
          VSIX_RESULT: ${{ needs.vsix.result }}
          SDK_RESULT: ${{ needs.sdk.result }}
          INT_RESULT: ${{ needs.integration.result }}
        run: |
          if [[ "$VSIX_RESULT" != "success" || "$SDK_RESULT" != "success" || "$INT_RESULT" != "success" ]]; then
            echo "SL_T Gold matrix incomplete: vsix=$VSIX_RESULT sdk=$SDK_RESULT integration=$INT_RESULT" >&2
            exit 1
          fi
          echo "SL_T Gold candidate passed Linux x86-64, macOS ARM64 and Windows x86-64" >>"$GITHUB_STEP_SUMMARY"
