[package]
name = "arandu_runtime"
version = "0.1.7"
edition = "2024"
license.workspace = true
authors.workspace = true

[features]
fuzzing = []

[dependencies]
# SL_R.2 reactor (epoll + timerfd on Linux); portable fallback elsewhere
libc = "0.2.189"
arandu_codegen = { path = "../arandu_codegen" }
blake3.workspace = true

# SL_R.3 io_uring is Linux-only (MAP_POPULATE / SYS_io_uring_*). Do not pull
# this crate on macOS/Windows or install-smoke matrix builds fail to compile.
# Code paths are already #[cfg(target_os = "linux")]; keep the dep gated too.
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7.14"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60.2", features = ["Win32_Networking_WinSock"] }

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]
