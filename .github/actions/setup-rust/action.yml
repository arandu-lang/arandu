name: Set up repository Rust
description: Install the pinned repository toolchain context and restore Cargo artifacts.

inputs:
  cache-key:
    description: Additional cache key for the job's compilation contract.
    required: true
  shared-key:
    description: Shared cache key across jobs on the same OS.
    required: false
    default: "core-rust-1.97.1"
  save-if:
    description: Condition for saving the cache.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Configure Defender exclusion (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        try {
          Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "cargo.exe", "rustc.exe" -ErrorAction SilentlyContinue
        } catch {
          # Ignore if permissions or Defender service is unavailable
        }
    - name: Repository toolchain
      shell: bash
      run: rustup show active-toolchain
    - name: Toolchain versions
      shell: bash
      run: |
        rustc -Vv
        cargo -V
    - name: Restore Cargo cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        key: ${{ inputs.cache-key }}
        shared-key: ${{ inputs.shared-key }}-${{ runner.os }}
        save-if: ${{ inputs.save-if }}
