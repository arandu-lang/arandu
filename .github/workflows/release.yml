# Publish installable tarballs to a GitHub Release when a version tag is pushed.
#
# Tag convention: vX.Y.Z must match crates/arandu_cli Cargo.toml version.
# Example (only after the version PR is merged and green):
#   git tag -a v0.1.0-rc.1 -m "Arandu 0.1.0-rc.1"
#   git push origin v0.1.0-rc.1
#
# Artifacts (per host target):
#   arandu-$VERSION-$TARGET.(tar.gz|zip) plus .blake3 and .blake3sum
#
# Install (example, Linux x86_64):
#   gh release download v0.1.0-rc.1 -p 'arandu-*-x86_64-unknown-linux-gnu.tar.gz*'
#   bash scripts/install-from-tarball.sh ./arandu-0.1.0-rc.1-x86_64-unknown-linux-gnu.tar.gz
#
# Manual dry run: Actions → Release → Run workflow. It never publishes.

name: Release

# Never cancel a release after immutable publication has started, and never run
# two promotions concurrently even when distinct tags are pushed close together.
concurrency:
  group: arandu-release-promotion
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note (workflow_dispatch only packages; no GitHub Release)"
        required: false
        default: "dry-run package matrix"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  validate:
    name: S3 / Release identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install repository toolchain
        run: rustup show active-toolchain
      - name: Component and tag version contract
        run: cargo run --locked -p xtask -- check-release-contract
      - name: Require release tag to come from main
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA^{commit}" origin/main; then
            echo "error: release tag must point to a commit reachable from main" >&2
            exit 1
          fi
      - name: Require the merged PR to have passed S0
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr="$({
            gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls"
          } | jq -s '
            map(.[]) |
            map(select(.merged_at != null and .base.ref == "main")) |
            sort_by(.merged_at) |
            last // empty
          ')"
          if [[ -z "$pr" ]]; then
            echo "error: tagged commit is not associated with a PR merged into main" >&2
            exit 1
          fi
          pr_number="$(jq -r .number <<<"$pr")"
          head_sha="$(jq -r .head.sha <<<"$pr")"
          conclusion="$({
            gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/commits/$head_sha/check-runs?per_page=100"
          } | jq -r -s '
            map(.check_runs[]) |
            map(select(.name == "S0 / Gate")) |
            sort_by(.completed_at) |
            last.conclusion // empty
          ')"
          if [[ "$conclusion" != "success" ]]; then
            echo "error: PR #$pr_number head $head_sha has no successful S0 / Gate" >&2
            exit 1
          fi
          echo "PR #$pr_number passed S0 / Gate at $head_sha"
      - name: Release archive security regressions
        run: python scripts/test_release_archives.py
      - name: Release set determinism regressions
        run: python scripts/test_prepare_release_assets.py

  package:
    name: S3 / Distribution (${{ matrix.target }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          # macos-latest is Apple Silicon (aarch64). macos-13 (Intel) was
          # retired by GitHub Dec 2025 — jobs sit forever "Waiting for a runner".
          # Intel Mac: install from source or cross-compile later; no hosted image.
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install repository toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}

      - name: Resolve VERSION (tag ↔ Cargo.toml)
        shell: bash
        run: |
          set -euo pipefail
          CARGO_V="$(
            sed -n 's/^version = "\([^"]*\)"/\1/p' crates/arandu_cli/Cargo.toml | head -1
          )"
          if [[ -z "$CARGO_V" ]]; then
            echo "error: could not read version from crates/arandu_cli/Cargo.toml" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            if [[ "$VERSION" != "$CARGO_V" ]]; then
              echo "error: tag '${TAG}' implies VERSION=${VERSION}, but Cargo.toml has ${CARGO_V}" >&2
              echo "  bump crates to ${VERSION} (or retag to v${CARGO_V}) before releasing" >&2
              exit 1
            fi
          else
            # workflow_dispatch: package crate version only (no Release upload)
            VERSION="$CARGO_V"
          fi

          # package-release builds for the host; archive name must match the host triple.
          HOST="$(rustc -vV | sed -n 's/^host: //p')"
          if [[ "$HOST" != "${{ matrix.target }}" ]]; then
            echo "error: runner host is '${HOST}', matrix.target is '${{ matrix.target }}'" >&2
            echo "  no cross-compile yet — fix matrix OS/target pairing" >&2
            exit 1
          fi

          {
            echo "VERSION=${VERSION}"
            echo "TARGET=${{ matrix.target }}"
          } >>"$GITHUB_ENV"
          echo "packaging arandu-${VERSION}-${{ matrix.target }}"

      - name: package-release
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/package-release.sh
        env:
          VERSION: ${{ env.VERSION }}
          TARGET: ${{ env.TARGET }}

      - name: package-release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-release.ps1
        env:
          VERSION: ${{ env.VERSION }}
          TARGET: ${{ env.TARGET }}

      - name: List dist/
        shell: bash
        run: ls -la dist/

      - name: Bundle arandu-lsp server into the extension VSIX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p editors/vscode/bin
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp target/release/arandu-lsp.exe editors/vscode/bin/arandu-lsp-win32.exe
            server=editors/vscode/bin/arandu-lsp-win32.exe
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            cp target/release/arandu-lsp editors/vscode/bin/arandu-lsp-darwin
            server=editors/vscode/bin/arandu-lsp-darwin
          else
            cp target/release/arandu-lsp editors/vscode/bin/arandu-lsp-linux
            server=editors/vscode/bin/arandu-lsp-linux
          fi
          "$server" --version
          ls -la editors/vscode/bin

      - name: Install package into empty prefix (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive="dist/arandu-${VERSION}-${TARGET}.tar.gz"
          ARANDU_NO_MODIFY_PATH=1 PREFIX="$RUNNER_TEMP/arandu-sdk" \
            bash scripts/install-from-tarball.sh "$archive"

      - name: Install package into empty prefix (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/install-from-zip.ps1 `
            "dist/arandu-$env:VERSION-$env:TARGET.zip" `
            -Prefix "$env:RUNNER_TEMP/arandu-sdk" -NoModifyPath

      - name: P7-A / installed lifecycle smoke (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 scripts/smoke_distribution.py \
            --arandu "$RUNNER_TEMP/arandu-sdk/bin/arandu" \
            --lsp "$RUNNER_TEMP/arandu-sdk/current/bin/arandu-lsp" \
            --corpus tests/projects --expected-version "$VERSION"

      - name: P7-A / installed lifecycle smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/smoke_distribution.py `
            --arandu "$env:RUNNER_TEMP/arandu-sdk/arandu-$env:VERSION/bin/arandu.exe" `
            --lsp "$env:RUNNER_TEMP/arandu-sdk/arandu-$env:VERSION/bin/arandu-lsp.exe" `
            --corpus tests/projects --expected-version "$env:VERSION"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install VS Code extension dependencies
        working-directory: editors/vscode
        run: npm ci --ignore-scripts

      - name: L3 / installed VSIX + installed SDK (Linux)
        if: runner.os == 'Linux'
        working-directory: editors/vscode
        shell: bash
        env:
          ARANDU_LSP_TEST_PATH: ${{ runner.temp }}/arandu-sdk/current/bin/arandu-lsp
          ARANDU_CLI_TEST_PATH: ${{ runner.temp }}/arandu-sdk/current/bin/arandu
        run: xvfb-run -a npm run test:installed

      - name: L3 / installed VSIX + installed SDK (macOS)
        if: runner.os == 'macOS'
        working-directory: editors/vscode
        env:
          ARANDU_LSP_TEST_PATH: ${{ runner.temp }}/arandu-sdk/current/bin/arandu-lsp
          ARANDU_CLI_TEST_PATH: ${{ runner.temp }}/arandu-sdk/current/bin/arandu
        run: npm run test:installed

      - name: L3 / installed VSIX + installed SDK (Windows)
        if: runner.os == 'Windows'
        working-directory: editors/vscode
        shell: pwsh
        env:
          ARANDU_LSP_TEST_PATH: ${{ runner.temp }}/arandu-sdk/arandu-${{ env.VERSION }}/bin/arandu-lsp.exe
          ARANDU_CLI_TEST_PATH: ${{ runner.temp }}/arandu-sdk/arandu-${{ env.VERSION }}/bin/arandu.exe
        run: npm run test:installed

      - name: S3 / reinstall and reject bad packages (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/arandu-${VERSION}-${TARGET}.tar.gz"
          before="$(readlink "$RUNNER_TEMP/arandu-sdk/current")"
          ARANDU_NO_MODIFY_PATH=1 PREFIX="$RUNNER_TEMP/arandu-sdk" \
            bash scripts/install-from-tarball.sh "$archive"
          test "$(readlink "$RUNNER_TEMP/arandu-sdk/current")" = "$before"
          mkdir -p "$RUNNER_TEMP/bad"
          bad="$RUNNER_TEMP/bad/$(basename "$archive")"
          cp "$archive" "$bad"
          cp "${archive}.sha256" "${bad}.sha256"
          printf 'tampered' >>"$bad"
          if ARANDU_NO_MODIFY_PATH=1 PREFIX="$RUNNER_TEMP/arandu-sdk" \
              bash scripts/install-from-tarball.sh "$bad"; then
            echo "tampered archive was accepted" >&2; exit 1
          fi
          test "$(readlink "$RUNNER_TEMP/arandu-sdk/current")" = "$before"
          if ARANDU_TEST_FAIL_PUBLISH=1 ARANDU_NO_MODIFY_PATH=1 \
              PREFIX="$RUNNER_TEMP/arandu-sdk" bash scripts/install-from-tarball.sh "$archive"; then
            echo "injected publish failure was accepted" >&2; exit 1
          fi
          test "$(readlink "$RUNNER_TEMP/arandu-sdk/current")" = "$before"

      - name: S3 / reinstall and reject bad packages (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "dist/arandu-$env:VERSION-$env:TARGET.zip"
          $prefix = "$env:RUNNER_TEMP/arandu-sdk"
          $launcher = "$prefix/bin/arandu.cmd"
          $before = (Get-FileHash -Algorithm SHA256 $launcher).Hash
          ./scripts/install-from-zip.ps1 $archive -Prefix $prefix -NoModifyPath
          if ((Get-FileHash -Algorithm SHA256 $launcher).Hash -ne $before) { throw 'same-version reinstall changed launcher' }
          $badDir = "$env:RUNNER_TEMP/bad"
          New-Item -ItemType Directory -Force $badDir | Out-Null
          $bad = "$badDir/$([IO.Path]::GetFileName($archive))"
          Copy-Item $archive $bad
          Copy-Item "$archive.sha256" "$bad.sha256"
          [IO.File]::AppendAllText($bad, 'tampered')
          try {
            ./scripts/install-from-zip.ps1 $bad -Prefix $prefix -NoModifyPath
            throw 'tampered archive was accepted'
          } catch {
            if ($_.Exception.Message -eq 'tampered archive was accepted') { throw }
          }
          if ((Get-FileHash -Algorithm SHA256 $launcher).Hash -ne $before) { throw 'failed install changed launcher' }
          $env:ARANDU_TEST_FAIL_PUBLISH = '1'
          try {
            ./scripts/install-from-zip.ps1 $archive -Prefix $prefix -NoModifyPath
            throw 'injected failure was accepted'
          } catch {
            if ($_.Exception.Message -eq 'injected failure was accepted') { throw }
          } finally { Remove-Item Env:ARANDU_TEST_FAIL_PUBLISH -ErrorAction SilentlyContinue }
          if ((Get-FileHash -Algorithm SHA256 $launcher).Hash -ne $before) { throw 'rollback changed launcher' }
          & $launcher --version

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arandu-${{ env.VERSION }}-${{ matrix.target }}
          path: |
            dist/arandu-${{ env.VERSION }}-${{ matrix.target }}.${{ matrix.archive }}
            dist/arandu-${{ env.VERSION }}-${{ matrix.target }}.${{ matrix.archive }}.blake3
            dist/arandu-${{ env.VERSION }}-${{ matrix.target }}.${{ matrix.archive }}.blake3sum
            dist/arandu-${{ env.VERSION }}-${{ matrix.target }}.${{ matrix.archive }}.sha256
            dist/arandu-${{ env.VERSION }}-${{ matrix.target }}.${{ matrix.archive }}.sha256sum
          if-no-files-found: error

  docs:
    name: S3 / Package stdlib docs
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install repository toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-stdlib-docs

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' crates/arandu_cli/Cargo.toml | head -1)"
          tag="v${version}"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          fi
          echo "VERSION=$version" >>"$GITHUB_ENV"
          echo "TAG=$tag" >>"$GITHUB_ENV"

      - name: Generate stdlib documentation JSON
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked -p arandu_cli -- doc stdlib/ --format=json --out-dir=target/stdlib_docs

      - name: Package documentation archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-docs
          tarball="dist-docs/arandu-stdlib-docs-${TAG}.tar.gz"
          tar -czf "$tarball" -C target/stdlib_docs .
          sha256sum "$tarball" > "${tarball}.sha256"
          ls -la dist-docs/

      - name: Upload documentation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stdlib-docs
          path: dist-docs/*
          if-no-files-found: error

  assemble:
    name: S3 / Verify release set
    needs: [package, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          pattern: arandu-*-*
          merge-multiple: true

      - name: Validate exact set and generate aggregate manifest
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/arandu_cli/Cargo.toml | head -1)"
          if [[ -z "$version" ]]; then
            echo "error: could not resolve release version" >&2
            exit 1
          fi
          tag="v${version}"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          fi
          python3 scripts/prepare_release_assets.py release-assets \
            --version "$version" --tag "$tag" --commit "$GITHUB_SHA"
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Ingest stdlib documentation archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stdlib-docs
          path: release-assets

      - name: List final release set
        shell: bash
        run: ls -la release-assets/

      - name: Upload verified release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release-set
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: S3 / Publish verified release
    needs: assemble
    runs-on: ubuntu-latest
    # A manual run proves the identical set without creating a release or attestation.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download verified release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-set
          path: release-assets

      - name: Refuse to modify an already published release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if state="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$state" != "true" ]]; then
              echo "error: $GITHUB_REF_NAME is already published and must never be replaced" >&2
              exit 1
            fi
          fi

      - name: Create draft and attach the complete set
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: Arandu ${{ github.ref_name }}
          draft: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.0.') || contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest every published byte
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: release-assets/*

      - name: Publish the complete draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  verify-public-release:
    name: S3 / Public RC (${{ matrix.target }})
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            checksum: sha256
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            checksum: sha256
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            checksum: sha256
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download archive from the public release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
          CHECKSUM: ${{ matrix.checksum }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="arandu-${version}-${TARGET}.${ARCHIVE}"
          mkdir public-release
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir public-release \
            --pattern "$name" --pattern "${name}.${CHECKSUM}"
          gh attestation verify "public-release/$name" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF"

      - name: Install and smoke public archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive="public-release/arandu-${version}-${{ matrix.target }}.tar.gz"
          ARANDU_NO_MODIFY_PATH=1 PREFIX="$RUNNER_TEMP/arandu-public-sdk" \
            bash scripts/install-from-tarball.sh "$archive"
          python3 scripts/smoke_distribution.py \
            --arandu "$RUNNER_TEMP/arandu-public-sdk/bin/arandu" \
            --lsp "$RUNNER_TEMP/arandu-public-sdk/current/bin/arandu-lsp" \
            --corpus tests/projects --expected-version "$version"

      - name: Install and smoke public archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $archive = "public-release/arandu-$version-${{ matrix.target }}.zip"
          $prefix = "$env:RUNNER_TEMP/arandu-public-sdk"
          ./scripts/install-from-zip.ps1 $archive -Prefix $prefix -NoModifyPath
          python scripts/smoke_distribution.py `
            --arandu "$prefix/arandu-$version/bin/arandu.exe" `
            --lsp "$prefix/arandu-$version/bin/arandu-lsp.exe" `
            --corpus tests/projects --expected-version $version

  rc-report:
    name: S3 / RC evidence
    needs: verify-public-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Record promotion evidence
        shell: bash
        run: |
          {
            echo "# Arandu ${GITHUB_REF_NAME} promotion evidence"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Linux x86-64: public download, provenance, install and corpus smoke passed"
            echo "- macOS ARM64: public download, provenance, install and corpus smoke passed"
            echo "- Windows x86-64: public download, provenance, install and corpus smoke passed"
            echo "- Immutable release: corrections require a new version and tag"
          } | tee rc-evidence.md >>"$GITHUB_STEP_SUMMARY"
      - name: Preserve RC evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rc-evidence-${{ github.ref_name }}
          path: rc-evidence.md
          if-no-files-found: error
          retention-days: 90

  notify-website:
    name: S3 / Notify website repository
    needs: [publish, rc-report]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    continue-on-error: true
    steps:
      - name: Dispatch release notification to website repository
        shell: bash
        env:
          DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "Notifying arandu-lang/website about $GITHUB_REF_NAME..."
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/arandu-lang/website/dispatches \
            -d "{\"event_type\": \"arandu-release\", \"client_payload\": {\"version\": \"$version\", \"tag\": \"$GITHUB_REF_NAME\"}}" || {
              echo "Notice: repository_dispatch could not be sent (check WEBSITE_DISPATCH_TOKEN secret). Continuing release."
            }
