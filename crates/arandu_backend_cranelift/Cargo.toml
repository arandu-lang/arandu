[package]
name = "arandu_backend_cranelift"
version = "0.1.10"
edition = "2024"
license.workspace = true
authors.workspace = true

[dependencies]
arandu_base = { path = "../arandu_base" }
arandu_codegen = { path = "../arandu_codegen" }
arandu_runtime = { path = "../arandu_runtime" }
arandu_semantics = { path = "../arandu_semantics" }
cranelift-codegen = "0.136.1"
cranelift-frontend = "0.136.1"
cranelift-jit = "0.136.1"
cranelift-module = "0.136.1"
cranelift-native = "0.136.1"
cranelift-object = "0.136.1"
gimli = { version = "0.33.0", default-features = false, features = ["std", "write"] }
target-lexicon = "0.13.5"
blake3 = { workspace = true }
rustc-hash = { workspace = true }
tracing.workspace = true

[dev-dependencies]
arandu_parser = { path = "../arandu_parser" }
